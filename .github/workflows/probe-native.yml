name: Probe native module builds

# 一次性探测：确认 armhf + Debian trixie 的 Node 20 上，
# 上游依赖里那几个没有预编译产物的原生模块到底能不能编译。
# 这不是发布流程的一部分，只是把「能不能编」这个事实问清楚，
# 避免在 Dockerfile 里写一堆猜测性的编译步骤。
#
# 用 workflow_dispatch 手动触发，结果看 Summary。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe armhf native builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build probe image
        uses: docker/build-push-action@v6
        with:
          context: docker-2x
          file: docker-2x/tests/Dockerfile.probe
          platforms: linux/arm/v7
          load: true
          tags: blikvm-probe:test
          cache-from: type=gha,scope=blikvm-2x-probe
          cache-to: type=gha,mode=max,scope=blikvm-2x-probe

      - name: Report results
        run: |
          set -eu
          docker run --rm --platform linux/arm/v7 --entrypoint bash blikvm-probe:test /probe.sh 2>&1 | tee probe.txt
          {
            echo "### armhf 原生模块编译探测"
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
